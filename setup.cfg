# setup.cfg
[metadata]
name = ahserver
version = 1.0.9
description = A application server base on aiohttp
author = yu moqing
author_email = yumoqing@gmail.com
license = MIT

[options]
packages = find:
python_requires = >=3.8
install_requires =
	redis
    asyncio
    aiofiles
    aiodns
    aiohttp==3.10.10
    aiohttp_session
    aiohttp_auth_autz
	aiohttp-middlewares
    aiohttp-cors
    aiomysql
    aioredis
    psycopg2-binary
    aiopg
    jinja2
    ujson
    openpyxl
    pillow
    py-natpmp

